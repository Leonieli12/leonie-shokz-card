name: Fix embedded image MIME types

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix PNG data URIs
        run: |
          sed -i 's#data:image/jpeg;base64,#data:image/png;base64,#g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix embedded image MIME types [skip ci]"
            git push
          fi
